services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_service
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - ORIGIN_PORT=${ORIGIN_PORT}
      - HOSTNAME=${HOSTNAME}
      - DB_HOST=ayd1f2
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    env_file: .env
    volumes:
      - /home/pdrpm:/app/data
    networks:
      - uhospital_backend
networks:
  uhospital_backend:
    external: true
    name: uhospital_backend_network
